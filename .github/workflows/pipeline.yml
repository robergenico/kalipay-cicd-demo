# Chaîne CI/CD sécurisée de Kalipay (zone Z6, flux M15, exigence E6)
#
# Chaque contrôle bloque la suite si il échoue. Les actions tierces sont épinglées
# par SHA de commit et les outils sont vérifiés par empreinte SHA-256 : une étiquette
# déplacée par un attaquant ne peut pas injecter de code dans la chaîne.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]

# Par défaut, aucun job n'a de droit en écriture.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
  CONFTEST_VERSION: "0.71.0"
  CONFTEST_SHA256: "765dfefdf0730693d7541ea0147e10d530a54ed257bbfec055ff34c837ffdf72"
  KYVERNO_VERSION: "1.19.1"
  KYVERNO_SHA256: "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae"
  CHECKOV_VERSION: "3.3.22"
  SEMGREP_VERSION: "1.179.0"

jobs:
  # 1. Recherche de secrets dans tout l'historique Git (incident de 2025, RQ3, RQ9)
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (empreinte vérifiée)
        run: |
          curl -sSfLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Analyser le dépôt
        run: gitleaks git --redact --verbose --config .gitleaks.toml .

  # 2. Analyse statique du code (SAST) avec les règles Kalipay (PAN en clair, TLS désactivé…)
  sast:
    name: Code (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lancer Semgrep
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/python --config .semgrep/ --error --metrics=off app/

  # 3. Dépendances vulnérables (SCA) : une CVE haute ou critique corrigeable bloque
  sca:
    name: Dépendances (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Trivy (empreinte vérifiée)
        run: |
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/
      - name: Analyser les dépendances Python
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 app/

  # 4. Infrastructure en code : Terraform et manifestes Kubernetes (risque R1)
  iac:
    name: Infra en code (Checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lancer Checkov
        run: |
          pipx install "checkov==${CHECKOV_VERSION}"
          checkov --config-file .checkov.yaml

  # 5. Les règles réseau doivent correspondre à la matrice de flux (livrable 7)
  flow-matrix:
    name: Matrice de flux (Conftest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Conftest (empreinte vérifiée)
        run: |
          curl -sSfLo ct.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  ct.tgz" | sha256sum -c -
          tar xzf ct.tgz conftest && sudo mv conftest /usr/local/bin/
      - name: Confronter les NetworkPolicies à la matrice
        run: |
          conftest test k8s/ \
            --policy policies/flow-matrix \
            --data policies/flow-matrix/flow-matrix.yaml

  # 6. Les manifestes respectent les politiques d'admission avant même d'atteindre le cluster
  kyverno:
    name: Admission (Kyverno)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la CLI Kyverno (empreinte vérifiée)
        run: |
          curl -sSfLo ky.tgz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  ky.tgz" | sha256sum -c -
          tar xzf ky.tgz kyverno && sudo mv kyverno /usr/local/bin/
      - name: Tester les politiques
        run: kyverno test policies/kyverno/tests
      - name: Appliquer les politiques aux manifestes
        run: |
          kyverno apply policies/kyverno/disallow-root.yaml policies/kyverno/require-limits.yaml \
            --resource k8s/deployment.yaml --detailed-results

  # 7. Image : build, DAST, scan, SBOM, puis publication et signature sur main uniquement
  image:
    name: Image (build, ZAP, Trivy, SBOM, Cosign)
    needs: [secrets, sast, sca, iac, flow-matrix, kyverno]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publier sur ghcr.io
      id-token: write # jeton OIDC pour la signature Cosign sans clé
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nom de l'image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/comptes" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          provenance: false

      - name: Démarrer l'image pour le DAST
        run: docker run -d --name comptes -p 8080:8080 --read-only --user 65532 "${{ steps.name.outputs.image }}:${{ github.sha }}"
      - name: DAST (OWASP ZAP baseline)
        run: |
          sleep 3
          chmod a+w .  # ZAP écrit son rapport avec son propre utilisateur
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080/health -c zap-rules.tsv -r zap-rapport.html -I
      - name: Arrêter l'image
        if: always()
        run: docker rm -f comptes

      - name: Installer Trivy (empreinte vérifiée)
        run: |
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/
      - name: Scanner l'image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.name.outputs.image }}:${{ github.sha }}"
      - name: Générer le SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports
          path: |
            sbom.cdx.json
            zap-rapport.html
          if-no-files-found: ignore

      # --- À partir d'ici : branche main seulement ---
      - name: Connexion à ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          provenance: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main'
      - name: Signer l'image et attacher le SBOM (Cosign sans clé)
        if: github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

  # 8. Déploiement : validation humaine, puis jeton AWS temporaire par OIDC (E6, E7)
  deploy:
    name: Déploiement (EKS Z1)
    needs: image
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    environment: production # second approbateur obligatoire, configuré dans GitHub
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtenir un jeton AWS de 15 minutes (aucune clé stockée)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 900
          aws-region: eu-west-3
      - name: Déployer l'image signée, référencée par son digest
        env:
          REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          aws eks update-kubeconfig --name kalipay-z1
          sed -i "s|ghcr.io/kalipay-demo/comptes@sha256:0\{64\}|${REF}|" k8s/deployment.yaml
          kubectl apply -f k8s/namespaces.yaml -f k8s/deployment.yaml -f k8s/networkpolicies.yaml
          kubectl -n z1-dmz rollout status deployment/comptes --timeout=120s
