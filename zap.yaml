env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://localhost:8080/health
    - http://localhost:8080/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: http://localhost:8080/
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: FAIL
    customMessage: ''
    id: 10020
  - action: FAIL
    customMessage: ''
    id: 10021
  - action: WARN
    customMessage: ''
    id: 10038
  - action: IGNORE
    customMessage: ''
    id: 10049
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: zap-rapport.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
